
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Formula Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;color:white}
#hud{position:absolute;top:12px;left:0;right:0;z-index:2;text-align:center;pointer-events:none;text-shadow:0 2px 5px #000}
h2{margin:0;color:#ff3048;font-size:25px}
#stats{margin:9px;font-weight:bold}
#message{font-size:14px}
#start{pointer-events:auto;background:#ed253d;color:white;border:0;border-radius:10px;padding:11px 23px;font-weight:bold}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:3;pointer-events:none}
.group{display:flex;gap:12px}
.ctrl{pointer-events:auto;width:68px;height:62px;border:1px solid #ffffff80;border-radius:15px;background:#101827bb;color:white;font-size:24px;touch-action:none}
#gas{background:#e82740dd}
#hint{position:absolute;bottom:95px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 1px 4px #000;pointer-events:none}
canvas{display:block}
</style>
</head>
<body>
<div id="hud">
  <h2>🏎️ FORMULA RUSH 3D</h2>
  <div id="stats">DISTANCE: 0 m &nbsp; | &nbsp; SPEED: 180 km/h</div>
  <div id="message">Ready to race?</div>
  <button id="start">START RACE</button>
</div>
<div id="hint">Hold ◀ ▶ to steer • Hold GAS to accelerate</div>
<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="brake">▼</button>
    <button class="ctrl" id="gas">▲</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 45, 150);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth/innerHeight, 0.1, 250
);
camera.position.set(0, 5.3, 10);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x4d7045,2));
const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-5,12,5);
sun.castShadow = true;
scene.add(sun);

function box(parent,w,h,d,color,x,y,z){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color,roughness:0.65})
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshStandardMaterial({color:0x258344})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.13;
ground.receiveShadow=true;
scene.add(ground);

// Race road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(12,240),
  new THREE.MeshStandardMaterial({color:0x343943,roughness:0.95})
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-0.09,-90);
scene.add(road);

// Track boundaries and road markings
const dashes=[];
for(let z=-205;z<12;z+=7){
  for(const x of [-3.95,3.95]){
    const stripe=box(scene,0.17,0.035,3,0xf4f4f4,x,-0.035,z);
    dashes.push(stripe);
  }
  const dash=box(scene,0.13,0.025,3.2,0xffffff,0,-0.025,z);
  dashes.push(dash);
}

// Trackside trees
const trees=[];
for(let z=-200;z<10;z+=12){
  for(const side of [-1,1]){
    const x=side*(8+Math.random()*5);
    const trunk=box(scene,0.4,1.5,0.4,0x70452c,x,0.65,z);
    const crown=new THREE.Mesh(
      new THREE.ConeGeometry(1.5,3.5,7),
      new THREE.MeshStandardMaterial({color:0x116534})
    );
    crown.position.set(x,2.9,z);
    crown.castShadow=true;
    scene.add(crown);
    trees.push({trunk,crown});
  }
}

// Formula-style car model
function makeCar(color){
  const car=new THREE.Group();
  box(car,1.15,0.32,2.25,color,0,0.45,0);
  box(car,0.82,0.20,0.85,color,0,0.59,-0.4);
  box(car,0.64,0.28,0.63,0x151b25,0,0.78,-0.35);
  box(car,0.52,0.08,0.85,0x16191f,0,0.35,-1.15);
  box(car,1.45,0.13,0.24,color,0,0.62,1.05);
  box(car,1.3,0.12,0.23,color,0,0.72,-1.05);

  const wheels=[];
  for(const x of [-0.67,0.67]){
    for(const z of [-0.73,0.73]){
      const wheel=new THREE.Mesh(
        new THREE.CylinderGeometry(0.24,0.24,0.17,16),
        new THREE.MeshStandardMaterial({color:0x111111,roughness:0.95})
      );
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,0.29,z);
      wheel.castShadow=true;
      car.add(wheel);
      wheels.push(wheel);
    }
  }
  car.userData.wheels=wheels;
  scene.add(car);
  return car;
}

const player=makeCar(0xef233c);
player.position.set(0,0,2.2);

let enemies=[];
function spawnEnemy(z){
  const colors=[0x18a8ff,0xffd43b,0xf4f4f4,0x9333ea];
  const car=makeCar(colors[Math.floor(Math.random()*colors.length)]);
  car.scale.setScalar(0.9);
  car.position.set([-2.5,0,2.5][Math.floor(Math.random()*3)],0,z);
  enemies.push(car);
}

let running=false,over=false;
let distance=0,speed=38,spawnTimer=0;
let steerLeft=false,steerRight=false,accelerating=false,braking=false;
const stats=document.getElementById('stats');
const message=document.getElementById('message');
const startButton=document.getElementById('start');

function startGame(){
  for(const e of enemies)scene.remove(e);
  enemies=[];
  player.position.x=0;
  player.rotation.set(0,0,0);
  distance=0;speed=38;spawnTimer=0;
  running=true;over=false;
  startButton.style.display='none';
  message.textContent='Race started! Avoid the cars!';
  for(let i=0;i<4;i++)spawnEnemy(-35-i*38);
}
startButton.addEventListener('click',startGame);

function finish(){
  running=false;over=true;
  message.textContent='💥 CRASH! Distance: '+Math.floor(distance)+' m';
  startButton.textContent='RACE AGAIN';
  startButton.style.display='inline-block';
}

function bind(id,setter){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();setter(true);
    try{el.setPointerCapture(e.pointerId)}catch{}
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])
    el.addEventListener(ev,()=>setter(false));
}
bind('left',v=>steerLeft=v);
bind('right',v=>steerRight=v);
bind('gas',v=>accelerating=v);
bind('brake',v=>braking=v);

window.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))
    e.preventDefault();
  if(e.key==='ArrowLeft'||e.key==='a')steerLeft=true;
  if(e.key==='ArrowRight'||e.key==='d')steerRight=true;
  if(e.key==='ArrowUp'||e.key==='w')accelerating=true;
  if(e.key==='ArrowDown'||e.key==='s')braking=true;
  if(e.key===' '&&!running)startGame();
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')steerLeft=false;
  if(e.key==='ArrowRight'||e.key==='d')steerRight=false;
  if(e.key==='ArrowUp'||e.key==='w')accelerating=false;
  if(e.key==='ArrowDown'||e.key==='s')braking=false;
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);

  if(running){
    speed += (accelerating?17:0);
    speed -= (braking?35:0);
    speed -= (accelerating?0:5)*dt;
    speed=Math.max(12,Math.min(speed,85));

    const move=(steerLeft?-1:0)+(steerRight?1:0);
    player.position.x+=move*dt*(3+speed/18);
    player.position.x=Math.max(-3.25,Math.min(3.25,player.position.x));
    player.rotation.z=-move*0.13;
    distance+=speed*dt*0.6;

    for(const d of dashes){
      d.position.z+=speed*dt*0.85;
      if(d.position.z>8)d.position.z-=217;
    }

    spawnTimer+=dt;
    if(spawnTimer>1.6){
      spawnTimer=0;
      spawnEnemy(-190);
    }

    for(let i=enemies.length-1;i>=0;i--){
      const e=enemies[i];
      e.position.z+=speed*dt*0.7;
      for(const w of e.userData.wheels)w.rotation.x+=speed*dt;
      if(Math.abs(e.position.x-player.position.x)<1.05 &&
         Math.abs(e.position.z-player.position.z)<1.7){
        finish();break;
      }
      if(e.position.z>12){
        scene.remove(e);
        enemies.splice(i,1);
      }
    }
    for(const w of player.userData.wheels)w.rotation.x+=speed*dt;
    stats.textContent='DISTANCE: '+Math.floor(distance)+' m | SPEED: '+Math.floor(speed*4)+' km/h';
  }

  camera.position.x+=(player.position.x*0.32-camera.position.x)*0.06;
  camera.lookAt(player.position.x*0.25,0.3,-7);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
